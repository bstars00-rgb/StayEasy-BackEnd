name: Codex Admin Default

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/codex-admin-default.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch default admin emails
        run: |
          node <<'NODE'
          const fs = require('fs')
          const file = 'server.js'
          let text = fs.readFileSync(file, 'utf8')
          const from = "function adminEmails() {\n  return new Set(String(process.env.ADMIN_EMAILS || '').split(',').map((email) => email.trim().toLowerCase()).filter(Boolean))\n}"
          const to = "function adminEmails() {\n  const defaults = 'demo-gle-user@stayeasy.local,demo.user@gmail.com'\n  return new Set(String(process.env.ADMIN_EMAILS || defaults).split(',').map((email) => email.trim().toLowerCase()).filter(Boolean))\n}"
          if (!text.includes("const defaults = 'demo-gle-user@stayeasy.local,demo.user@gmail.com'")) text = text.replace(from, to)
          fs.writeFileSync(file, text)
          NODE
          node --check server.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Allow demo admin email by default"
            git push
          fi
