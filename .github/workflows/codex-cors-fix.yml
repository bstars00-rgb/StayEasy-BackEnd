name: Codex CORS Fix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/codex-cors-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch OPTIONS CORS headers
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs')
          const file = 'server.js'
          let text = fs.readFileSync(file, 'utf8')
          const from = "function noContent(res) { res.writeHead(204, { 'Access-Control-Allow-Origin': process.env.CORS_ORIGIN || '*' }); res.end() }"
          const to = "function noContent(res) {\n  res.writeHead(204, {\n    'Access-Control-Allow-Origin': process.env.CORS_ORIGIN || '*',\n    'Access-Control-Allow-Headers': 'Authorization, Content-Type',\n    'Access-Control-Allow-Methods': 'GET, POST, PATCH, DELETE, OPTIONS',\n    'Access-Control-Max-Age': '600'\n  })\n  res.end()\n}"
          if (!text.includes("'Access-Control-Max-Age': '600'")) text = text.replace(from, to)
          fs.writeFileSync(file, text)
          NODE
          node --check server.js
      - name: Commit CORS fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Fix CORS preflight headers"
            git push
          fi
